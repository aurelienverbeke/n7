default-lease-time 600;
max-lease-time 7200;

authoritative;

option domain-name-servers 201.201.201.161;
option domain-name "aurelien.fr";

subnet 192.168.20.0 netmask 255.255.255.128 {
  range 192.168.20.2 192.168.20.99;
  option subnet-mask 255.255.255.128;
  option broadcast-address 192.168.20.127;
  option routers 192.168.20.100;
}
